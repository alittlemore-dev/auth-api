name: Backend Docker image security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-docker-image-security:
    name: Backend Docker image security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_EXPORT_PATH: auth-api-image.tar
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build, lint, and scan Docker image
        run: make security-docker-image
      - name: Upload checked image
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-api-image-${{ github.sha }}
          path: auth-api-image.tar
          retention-days: 1
          compression-level: 0
